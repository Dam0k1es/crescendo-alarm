# DRAFT of the F-Droid build recipe (fdroiddata: metadata/com.crescendoalarm.crescendoalarm.yml).
# NOT submitted and NOT build-tested: written from a current Flutter recipe in fdroiddata
# (de.wger.flutter) and from this repository's own build files on 2026-10-23. Before a merge
# request: run it through `fdroid build` (or the fdroiddata CI) and fix what breaks.
#
# Open questions the first build must answer:
#  - Signing: android/app/build.gradle.kts declares signingConfigs.release from key.properties,
#    which F-Droid's builder does not have. fdroidserver is meant to strip signing configs; if the
#    build still fails, make the release signingConfig conditional on key.properties existing.
#  - Native code: flutter_zxing compiles C++ (CMake/NDK); the build here uses NDK 28.2.13676358
#    (= r28c). The recipe's `ndk:` and any CMake package must match.
#  - JDK 17, Gradle 9.8.0 (the wrapper downloads it; distributionSha256Sum is pinned) and
#    AGP 9.4.1; compileSdk 36 comes from Flutter's own default.
#  - License: GPL-3.0-or-later vs GPL-3.0-only is undecided (docs/TODO.md, L1-06).
#  - Fastlane metadata is in fastlane/metadata/android/en-US/ (title, descriptions, changelogs,
#    icon, screenshots) - no summary/description fields are needed here.

Categories:
  - Time
License: GPL-3.0-or-later
SourceCode: https://github.com/Dam0k1es/crescendo-alarm
IssueTracker: https://github.com/Dam0k1es/crescendo-alarm/issues

AutoName: Crescendo Alarm

RepoType: git
Repo: https://github.com/Dam0k1es/crescendo-alarm.git

Builds:
  - versionName: 1.6.0
    versionCode: 7
    commit: v1.6.0
    output: build/app/outputs/flutter-apk/app-release.apk
    srclibs:
      - flutter@stable
    rm:
      - ios
      - linux
    prebuild:
      # The Flutter release is named in the repository (.fvmrc); the same number is in the CI
      # workflows and in pubspec.yaml's environment constraint (test/build_pins_test.dart).
      - flutterVersion=$(sed -n -E 's/.*"flutter":\s*"([^"]+)".*/\1/p' .fvmrc)
      - '[[ $flutterVersion ]]'
      - git -C $$flutter$$ checkout -f $flutterVersion
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter pub get --enforce-lockfile
    scandelete:
      - .pub-cache
    build:
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter build apk --release
    ndk: r28c

AutoUpdateMode: Version
UpdateCheckMode: Tags ^v[0-9]
UpdateCheckData: pubspec.yaml|version:\s.+\+(\d+)|.|version:\s(.+)\+
CurrentVersion: 1.6.0
CurrentVersionCode: 7
