# DRAFT of the F-Droid build recipe (fdroiddata: metadata/com.crescendoalarm.crescendoalarm.yml).
# NOT submitted and NOT build-tested: written from a current Flutter recipe in fdroiddata
# (de.wger.flutter) and from this repository's own build files on 2026-10-23. Before a merge
# request: run it through `fdroid build` (or the fdroiddata CI) and fix what breaks.
#
# Open questions the first build must answer:
#  - Signing: a trial release build without key.properties failed in validateSigningRelease
#    ("Keystore file not set for signing config release", 2026-10-23); build.gradle.kts now falls
#    back to the debug key ONLY when CRESCENDO_ALLOW_DEBUG_SIGNED_RELEASE=1 (set below). F-Droid
#    re-signs with its own key regardless.
#  - Native code: flutter_zxing compiles C++ (CMake/NDK); the build here uses NDK 28.2.13676358
#    (= r28c). The recipe's `ndk:` and any CMake package must match.
#  - JDK 17, Gradle 9.8.0 (the wrapper downloads it; distributionSha256Sum is pinned) and
#    AGP 9.4.1; compileSdk 36 comes from Flutter's own default; minSdk 26, no desugaring.
#  - License: GPL-3.0-or-later (decision 2026-10-23; test/licence_form_test.dart).
#  - Fastlane metadata is in fastlane/metadata/android/en-US/ (title, descriptions, changelogs,
#    icon, screenshots) - no summary/description fields are needed here.

Categories:
  - Time
License: GPL-3.0-or-later
SourceCode: https://github.com/Dam0k1es/crescendo-alarm
IssueTracker: https://github.com/Dam0k1es/crescendo-alarm/issues

AutoName: Crescendo Alarm

RepoType: git
Repo: https://github.com/Dam0k1es/crescendo-alarm.git

Builds:
  - versionName: 1.7.0
    versionCode: 8
    commit: v1.7.0
    output: build/app/outputs/flutter-apk/app-release.apk
    srclibs:
      - flutter@stable
    rm:
      - ios
      - linux
    prebuild:
      # The Flutter release is named in the repository (.fvmrc); the same number is in the CI
      # workflows and in pubspec.yaml's environment constraint (test/build_pins_test.dart).
      - flutterVersion=$(sed -n -E 's/.*"flutter":\s*"([^"]+)".*/\1/p' .fvmrc)
      - '[[ $flutterVersion ]]'
      - git -C $$flutter$$ checkout -f $flutterVersion
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter pub get --enforce-lockfile
    scandelete:
      - .pub-cache
    build:
      - export PUB_CACHE=$(pwd)/.pub-cache
      # F-Droid's builder has no signing key and re-signs with its own; this lets the
      # release build fall back to the debug key instead of failing in
      # validateSigningRelease (build.gradle.kts; opt-in, no workflow sets it).
      - export CRESCENDO_ALLOW_DEBUG_SIGNED_RELEASE=1
      - $$flutter$$/bin/flutter build apk --release
    ndk: r28c

AutoUpdateMode: Version
UpdateCheckMode: Tags ^v[0-9]
UpdateCheckData: pubspec.yaml|version:\s.+\+(\d+)|.|version:\s(.+)\+
CurrentVersion: 1.7.0
CurrentVersionCode: 8
