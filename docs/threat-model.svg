<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1182" viewBox="0 0 1400 1182" font-family="DejaVu Sans, Arial, sans-serif">
  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#333"/>
    </marker>
  </defs>
  <style>
    .b   { fill:none; stroke:#888; stroke-width:2; stroke-dasharray:9 5; }
    .bl  { font-size:15px; fill:#555; font-weight:bold; letter-spacing:.5px; }
    .ext { fill:#eef2f7; stroke:#5b7ea8; stroke-width:1.6; }
    .app { fill:#e8f3ea; stroke:#4a8759; stroke-width:1.6; }
    .st  { fill:#fdf3e0; stroke:#c08a2e; stroke-width:1.6; }
    .n   { font-size:14px; fill:#111; }
    .ns  { font-size:12px; fill:#444; }
    .f   { stroke:#333; stroke-width:1.6; fill:none; marker-end:url(#a); }
    .fl  { font-size:11px; fill:#333; }
    .t   { font-size:11.5px; fill:#b00; }
    .th  { fill:#fdecec; stroke:#b00; stroke-width:1.3; }
    .ok  { font-size:11.5px; fill:#0a6b2e; }
    .h   { font-size:22px; font-weight:bold; fill:#111; }
    .sub { font-size:13px; fill:#555; }
  </style>

  <text x="24" y="34" class="h">Crescendo Alarm - Threat Model (data flow, STRIDE)</text>
  <text x="24" y="56" class="sub">The asset to protect here is AVAILABILITY first: that the alarm rings. Secrecy and confidentiality come second.</text>
  <text x="24" y="74" class="sub">Red = threat, green = effective countermeasure. T numbers -> docs/TODO.md, FR numbers -> docs/scheduling-v2-spec.md.</text>

  <!-- ROW 1: physical world -->
  <rect x="24" y="94" width="900" height="92" rx="8" class="b"/>
  <text x="36" y="114" class="bl">TRUST BOUNDARY - physical world</text>
  <rect x="44" y="126" width="180" height="46" rx="6" class="ext"/>
  <text x="56" y="145" class="n">Printed QR code</text>
  <text x="56" y="162" class="ns">placed away from the bed</text>
  <rect x="252" y="126" width="180" height="46" rx="6" class="ext"/>
  <text x="264" y="145" class="n">Third parties nearby</text>
  <text x="264" y="162" class="ns">lock screen, camera view</text>
  <rect x="460" y="126" width="180" height="46" rx="6" class="ext"/>
  <text x="472" y="145" class="n">User</text>
  <text x="472" y="162" class="ns">wants to be woken</text>
  <rect x="944" y="94" width="432" height="92" rx="5" class="th"/>
  <text x="956" y="114" class="t">S/T: the code is photographed off the screen or</text>
  <text x="956" y="130" class="t">reprinted - the "guaranteed wake-up" is defeated.</text>
  <text x="956" y="150" class="ok">Mitigated: the scanned raw value is never displayed</text>
  <text x="956" y="166" class="ok">or logged (T-89). Residual risk: a code on paper</text>
  <text x="956" y="182" class="ok">is copyable by design.</text>

  <!-- ROW 2: three boundaries -->
  <rect x="24" y="206" width="330" height="238" rx="8" class="b"/>
  <text x="36" y="226" class="bl">TRUST BOUNDARY - Android OS</text>
  <rect x="44" y="240" width="140" height="44" rx="6" class="ext"/>
  <text x="56" y="258" class="n">Calendar provider</text>
  <text x="56" y="274" class="ns">read-only</text>
  <rect x="200" y="240" width="140" height="44" rx="6" class="ext"/>
  <text x="212" y="258" class="n">Camera</text>
  <text x="212" y="274" class="ns">while scanning</text>
  <rect x="44" y="300" width="140" height="44" rx="6" class="ext"/>
  <text x="56" y="318" class="n">AlarmManager</text>
  <text x="56" y="334" class="ns">RTC_WAKEUP, exact</text>
  <rect x="200" y="300" width="140" height="44" rx="6" class="ext"/>
  <text x="212" y="318" class="n">Notifications</text>
  <text x="212" y="334" class="ns">full-screen intent</text>
  <rect x="44" y="360" width="296" height="70" rx="6" class="ext"/>
  <text x="56" y="378" class="n">System clock / time zone</text>
  <text x="56" y="394" class="ns">FR-16 compares the offset</text>
  <text x="56" y="410" class="ns">at the ring and whenever a</text>
  <text x="56" y="426" class="ns">notification is scheduled (T-199)</text>

  <rect x="378" y="206" width="546" height="238" rx="8" class="b"/>
  <text x="390" y="226" class="bl">APPLICATION (process)</text>
  <rect x="398" y="240" width="240" height="44" rx="6" class="app"/>
  <text x="410" y="258" class="n">UI / settings</text>
  <text x="410" y="274" class="ns">alarms, sleep habits</text>
  <rect x="656" y="240" width="250" height="44" rx="6" class="app"/>
  <text x="668" y="258" class="n">QR gate</text>
  <text x="668" y="274" class="ns">only stop path (fail-safes: R4)</text>
  <rect x="398" y="300" width="240" height="60" rx="6" class="app"/>
  <text x="410" y="318" class="n">scheduling-v2</text>
  <text x="410" y="334" class="ns">checkpoint -&gt; replan -&gt; FR-18</text>
  <text x="410" y="350" class="ns">serialized (T-77)</text>
  <rect x="656" y="300" width="250" height="60" rx="6" class="app"/>
  <text x="668" y="318" class="n">Background isolate</text>
  <text x="668" y="334" class="ns">built for FR-16 checkpoint 2; runs</text>
  <text x="668" y="350" class="ns">in the main isolate (T-199)</text>
  <rect x="398" y="376" width="508" height="54" rx="6" class="app"/>
  <text x="410" y="396" class="n" font-weight="bold">No network access in lib/ - deliberate, the privacy policy relies on it.</text>
  <text x="410" y="418" class="ns">That removes the whole class "data silently leaves the device".</text>

  <rect x="948" y="206" width="428" height="238" rx="8" class="b"/>
  <text x="960" y="226" class="bl">STORAGE (app-private)</text>
  <rect x="968" y="240" width="388" height="58" rx="6" class="st"/>
  <text x="980" y="258" class="n">SharedPreferences</text>
  <text x="980" y="274" class="ns">alarms, week plan, preferred time, UTC offset</text>
  <text x="980" y="290" class="ns">diagnostics log (opt-in, 2 buffers x 512, PII-free)</text>
  <rect x="968" y="312" width="388" height="44" rx="6" class="st"/>
  <text x="980" y="330" class="n">deactivationCode</text>
  <text x="980" y="346" class="ns">plaintext: base64 of 16 random bytes, or imported</text>
  <rect x="968" y="370" width="388" height="60" rx="5" class="th"/>
  <text x="978" y="388" class="t">I/T: readable on a rooted device - the code can be</text>
  <text x="978" y="404" class="t">replaced, a sleep pattern derived.</text>
  <text x="978" y="422" class="ok">Mitigated: allowBackup="false", log has no String channel.</text>

  <!-- flows: only the load-bearing ones, laid out so nothing crosses -->
  <path d="M134,172 L134,240" class="f"/>
  <text x="140" y="205" class="fl">Events</text>
  <path d="M270,172 L270,240" class="f"/>
  <text x="276" y="205" class="fl">Scan</text>
  <path d="M550,172 L518,240" class="f"/>
  <text x="556" y="205" class="fl">Settings</text>
  <path d="M114,284 L114,292 L398,292 L398,306" class="f"/>
  <text x="180" y="289" class="fl">FR-2 hardFloor</text>
  <path d="M410,360 L410,352 L114,352 L114,344" class="f"/>
  <text x="180" y="349" class="fl">FR-18 arms alarms</text>
  <path d="M906,266 L968,266" class="f"/>
  <path d="M906,330 L968,330" class="f"/>
  <path d="M781,284 L781,300" class="f"/>

  <!-- ROW 2b: DoS threat, its own row so nothing overlaps -->
  <rect x="24" y="458" width="1352" height="92" rx="5" class="th"/>
  <text x="36" y="478" class="t">D - the heaviest category here, because "outage" means oversleeping: Doze, battery saving and OEM process killers can prevent the alarm. Whether a</text>
  <text x="36" y="494" class="t">force-stop drops the package's AlarmManager alarms is unresolved (R3, T-93 - two device runs disagree). Two own defects of this kind are fixed:</text>
  <text x="36" y="510" class="t">FR-9's safety valve was a one-way street into a permanently dead alarm (T-78); the old engine deleted every alarm and then aborted (T-64).</text>
  <text x="36" y="526" class="ok">Both are pinned by regression tests, T-64 also confirmed on a real device. A reboot was survived on a real device, a locked one via the Direct</text>
  <text x="36" y="542" class="ok">Boot fallback (T-158); a long idle stretch with the app never reopened is still unproven (T-164). FR-17 re-arms everything at the next app start.</text>

  <!-- ROW 3: supply chain -->
  <rect x="24" y="570" width="1352" height="180" rx="8" class="b"/>
  <text x="36" y="590" class="bl">TRUST BOUNDARY - supply chain</text>
  <rect x="44" y="604" width="170" height="44" rx="6" class="ext"/>
  <text x="56" y="622" class="n">Source repository</text>
  <text x="56" y="638" class="ns">public, GitHub</text>
  <rect x="242" y="604" width="180" height="44" rx="6" class="ext"/>
  <text x="254" y="622" class="n">Dependencies</text>
  <text x="254" y="638" class="ns">pub.dev, Maven</text>
  <rect x="450" y="604" width="200" height="44" rx="6" class="ext"/>
  <text x="462" y="622" class="n">CI gate</text>
  <text x="462" y="638" class="ns">SCA, Secrets, SAST, E2E</text>
  <rect x="678" y="604" width="190" height="44" rx="6" class="ext"/>
  <text x="690" y="622" class="n">Signing key</text>
  <text x="690" y="638" class="ns">GitHub Secret</text>
  <rect x="896" y="604" width="190" height="44" rx="6" class="ext"/>
  <text x="908" y="622" class="n">Signed APK</text>
  <text x="908" y="638" class="ns">artifact / release</text>
  <path d="M214,626 L242,626" class="f"/>
  <path d="M422,626 L450,626" class="f"/>
  <path d="M650,626 L678,626" class="f"/>
  <path d="M868,626 L896,626" class="f"/>
  <rect x="44" y="662" width="1312" height="74" rx="5" class="th"/>
  <text x="56" y="680" class="t">T: a compromised dependency reaches the APK directly through the build. The two non-free dependencies (Syncfusion, Google/ML Kit) were</text>
  <text x="56" y="696" class="t">replaced (T-05, T-33; R8/R9 met) - a control problem as well as a licence one; a guard test and an SBOM check keep them out (T-144).</text>
  <text x="56" y="714" class="ok">Mitigated: osv-scanner (Dart and native), trufflehog, mobsfscan and MobSF can turn the run red, and since T-92 the same gate also guards the</text>
  <text x="56" y="730" class="ok">tag path - before, a signed release APK could be built entirely unchecked. Open: dynamic analysis (there is none).</text>

  <!-- ROW 4: legend -->
  <rect x="24" y="770" width="1352" height="390" rx="8" fill="#fafafa" stroke="#ccc"/>
  <text x="36" y="792" class="bl">STRIDE - coverage and residual risk</text>
  <text x="36" y="818" class="n">S  Spoofing</text>
  <text x="230" y="818" class="ns">A copied QR code defeats the gate. Copyable by design - the app cannot prevent that, only avoid making it easier.</text>
  <text x="36" y="846" class="n">T  Tampering</text>
  <text x="230" y="846" class="ns">Plaintext code and week plan on a rooted device; clock/time zone manipulation; compromised dependency.</text>
  <text x="230" y="864" class="ns">FR-16 handles legitimate time zone changes; it does not help against intent.</text>
  <text x="36" y="892" class="n">R  Repudiation</text>
  <text x="230" y="892" class="ns">Not applicable and deliberately not modelled: one user, no multi-party process, no duty of proof.</text>
  <text x="36" y="920" class="n">I  Info-Disclosure</text>
  <text x="230" y="920" class="ns">Logs and lock screen fixed (T-89: QR code, calendar name, event title, exception text, debug notifications).</text>
  <text x="230" y="938" class="ns">Residual risk: on a compromised device a sleep pattern can be derived from the stored plan.</text>
  <text x="230" y="956" class="ns">Device-protected storage (native, app-private): the next alarm's due time (T-158) and the Do Not Disturb window (T-198) are kept</text>
  <text x="230" y="974" class="ns">where they are readable before the first unlock - by design, so the locked fallback and DND work; still a timing record at rest.</text>
  <text x="230" y="992" class="ns">Share/Print of the code (a PNG) and Copy of the diagnostics log hand data only to where the USER chooses - the only, user-started outflow.</text>
  <text x="36" y="1020" class="n">D  Denial of Service</text>
  <text x="230" y="1020" class="ns">The heaviest category here - see its own row above. T-64 and T-78 fixed; R3 force-stop and long idle unresolved.</text>
  <text x="36" y="1048" class="n">E  Elevation</text>
  <text x="230" y="1048" class="ns">WRITE_CALENDAR is declared (device_calendar requires both calendar permissions before any read) but never used -</text>
  <text x="230" y="1066" class="ns">test/no_calendar_write_test.dart forbids every calendar write (T-161, T-49). READ_EXTERNAL_STORAGE is stripped from the manifest;</text>
  <text x="230" y="1084" class="ns">scripts/check_manifest_permissions.py pins the release APK's permissions to an exact allow-list (T-49).</text>
  <text x="230" y="1102" class="ns">ACCESS_NOTIFICATION_POLICY (Do Not Disturb access, granted by the user in system settings) lets the app switch DND - global DND on</text>
  <text x="230" y="1120" class="ns">Android 14 and older, an app-owned mode on 15+. Native receivers: SleepTimeDndReceiver and the fallback receiver are not exported;</text>
  <text x="230" y="1138" class="ns">DirectBootReceiver is exported but only receives the protected LOCKED_BOOT_COMPLETED, which only the OS can send (T-160).</text>
</svg>
