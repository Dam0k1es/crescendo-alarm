name: E2E Tests (reusable)
# Called by both release.yml (gates the signed build) and ci.yml (runs on
# master pushes/PRs, so a broken scenario is caught before a release, not
# only during one - see docs/TODO.md T-37). Not meant to be run directly.

on:
  workflow_call:

env:
  FLUTTER_VERSION: "3.47.2"

jobs:
  e2e-tests:
    name: E2E tests (real emulator)
    runs-on: ubuntu-latest
    # Provisorisch auf eine Stunde (docs/TODO.md T-98). Die 25 Minuten waren auf
    # den Stand VOR den Engine-Szenarien zugeschnitten: der Job brauchte damals
    # 19m53s. Dazu kamen vier neue Szenarien (eines wartet auf ein echtes
    # Klingeln), ein zweiter `flutter test`-Aufruf fuer arm_alarm_test.dart und
    # der Reboot-Nachweis mit bis zu 240s Bootwartezeit - der erste Lauf danach
    # lief prompt in den Timeout. Ein Zeitlimit soll einen haengenden Job
    # abschneiden, nicht einen langsamen; deshalb erst grosszuegig, und erst
    # nach ein paar gemessenen Laeufen wieder eng.
    timeout-minutes: 60
    steps:
      - name: Free disk space
        # A fresh AVD's userdata partition alone needs ~7.4 GB - GitHub's
        # runners don't have that much free by default once their
        # pre-installed toolchains are accounted for (confirmed by a real
        # "Not enough space to create userdata partition" failure). Remove
        # large pre-installed toolchains this job never uses; deliberately
        # leaves the Android SDK/NDK alone since our own build needs it.
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost \
            /opt/hostedtoolcache/CodeQL
          docker image prune -af || true
          df -h /
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-${{ hashFiles('pubspec.lock') }}
          restore-keys: pub-
      - uses: actions/cache@v4
        with:
          # docs/TODO.md T-102: vorher lag hier `~/.gradle/caches` komplett drin.
          # Das waechst unbegrenzt - es enthaelt neben den heruntergeladenen
          # Abhaengigkeiten auch jede transformierte AAR und jeden
          # Build-Cache-Eintrag. Ergebnis: zwei Gradle-Caches mit 3746 MB und
          # 2397 MB, und ein Restore, der laenger dauert als der Build spart.
          # Im Lauf 34535358135 ist der Release-Build daran gestorben - der
          # Cache-Schritt kippte nach 2m49s, `flutter build apk` lief nie.
          # Gecacht wird jetzt nur, was sich wirklich lohnt: die geladenen
          # Module und der Wrapper.
          path: |
            ~/.gradle/caches/modules-2
            ~/.gradle/wrapper
          key: gradle-modules-${{ hashFiles('android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-modules-
      - run: flutter pub get

      - name: Enable KVM group perms
        # /dev/kvm exists on GitHub's Linux runners but isn't accessible to
        # the runner user by default - without this, android-emulator-runner
        # silently falls back to `-accel off` (full software CPU emulation),
        # and the emulator then takes far longer to boot than its own
        # boot-wait timeout allows. This project has hit the software-emulation
        # failure mode before, just on a different (nested-virtualization)
        # root cause on a local dev VM - see docs/quality-baseline-2026-09.md's
        # VM recommendations if you have a local copy of that (gitignored)
        # snapshot doc.
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run E2E tests on a real emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          # A single line, not an inline multi-line script: this action
          # appears to run each line of a multi-line `script:` value as its
          # own separate `sh -c` call, which breaks any real multi-line shell
          # construct (a background subshell here) - see the script itself
          # for what actually runs.
          script: bash .github/scripts/run_e2e_tests.sh

      - name: Upload E2E evidence (video, audio-focus log, test output)
        # if: always() - an evidence artifact matters most exactly when the
        # run failed, to see what actually happened on the device.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-evidence
          path: e2e_evidence/
          if-no-files-found: warn
          # A backstop for callers (like ci.yml) that don't run their own
          # pruning job - release.yml's cleanup-old-artifacts job still
          # prunes its own runs' evidence immediately, well inside this
          # window.
          retention-days: 14
