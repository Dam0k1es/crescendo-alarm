name: Security gate (reusable)
# Called by ci.yml (master pushes and PRs) AND by release.yml.
#
# Why reusable rather than written out twice: the tag-triggered release path
# used to have no SCA, secret, or SAST gate at all - release.yml only ran
# `flutter analyze`, `flutter test`, and the E2E suite. An APK built,
# signed, and attached to a GitHub Release via a tag could therefore carry
# a vulnerable dependency or a checked-in secret, even though the same
# commit would have failed that check on `master`. Exactly the kind of gap
# that duplicated state creates - so the gate now lives here exactly once.
#
# What can turn red here is a real gate:
#   osv-scanner    - known vulnerabilities in pubspec.lock
#   trufflehog     - verified and unknown secrets (--fail)
#   mobsfscan      - Android SAST, filtered against
#                    .github/security-exceptions.json (mobsfscan's own exit
#                    code doesn't distinguish accepted findings from new
#                    ones, hence --no-fail plus its own check step afterward)

on:
  workflow_call:

jobs:
  sca-and-secrets:
    name: SCA & Secret Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install osv-scanner
        run: |
          curl -sSfL -o /usr/local/bin/osv-scanner \
            "https://github.com/google/osv-scanner/releases/latest/download/osv-scanner_linux_amd64"
          chmod +x /usr/local/bin/osv-scanner
      - name: Install trufflehog
        run: |
          curl -sSfL https://raw.githubusercontent.com/trufflesecurity/trufflehog/main/scripts/install.sh \
            | sh -s -- -b /usr/local/bin
      - name: osv-scanner (SCA)
        run: osv-scanner --lockfile=pubspec.lock
      - name: trufflehog (secrets)
        run: trufflehog filesystem --results=verified,unknown --fail .

  mobsfscan:
    name: mobsfscan (Android source)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install mobsfscan
      - name: Run mobsfscan
        # --no-fail: mobsfscan's own exit code doesn't distinguish accepted
        # from un-accepted findings, so it never gates directly - the
        # following step does that, against .github/security-exceptions.json
        # (see docs/REQUIREMENTS.md R1).
        run: mobsfscan --no-fail --json -o mobsfscan-report.json android/
      - name: Check for un-excepted findings
        run: python3 scripts/mobsfscan_check.py mobsfscan-report.json .github/security-exceptions.json
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobsfscan-report
          path: mobsfscan-report.json
          retention-days: 30
