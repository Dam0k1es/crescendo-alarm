name: CI
#
# Branch strategy:
# - dev: fast feedback (analyze + test) plus a debug "development" APK, uploaded as a build
#   artifact so any dev-branch commit can be installed for a quick look.
# - master (and PRs targeting it): the full pipeline - analyze, test, SCA, secret scan,
#   mobsfscan, a signed "production" release APK build, and a full MobSF static scan of that
#   build. The production APK is uploaded as a build artifact on every master push, in addition
#   to the separate tag-triggered release workflow that attaches one to a formal GitHub Release.
# Only Android is built here - Linux/iOS/desktop/web targets aren't real deployment targets for
# this project (see README "Supported Platforms"), so there's no CI job for them.

on:
  push:
    branches: [master, dev]
  pull_request:
    branches: [master]
  workflow_dispatch:

env:
  FLUTTER_VERSION: "3.47.2"

jobs:
  analyze-and-test:
    # Der Name bleibt, weil release.yml und die needs: unten darauf verweisen.
    # Inhaltlich ist das jetzt eine Matrix ueber Zeitzonen - siehe unten.
    name: Analyze & Test (TZ=${{ matrix.tz }})
    runs-on: ubuntu-latest
    strategy:
      # Ein Fehlschlag in einer Zone soll die anderen Zonen noch zu Ende
      # laufen lassen: bei einem Frame-Fehler ist das MUSTER ueber die Zonen
      # die eigentliche Diagnose (nur Halbstunden-Offsets? nur Sommerzeit?).
      fail-fast: false
      matrix:
        # Die dominante Fehlerklasse dieses Projekts ist Frame-Verwirrung
        # (Instant gegen Wanduhrzeit). Drei echte Bugs - docs/TODO.md T-61,
        # T-74d, T-76 - waren auf der Entwicklungsmaschine PRINZIPIELL
        # unsichtbar, weil die auf UTC+0 laeuft; GitHubs Runner auch. Die
        # Zonen sind deshalb nach Fehlerpotenzial gewaehlt, nicht nach
        # Bekanntheit:
        #   Europe/Berlin      Sommerzeitumstellung (T-74d/T-76)
        #   Asia/Tokyo         grosser Versatz, KEINE Sommerzeit
        #   America/St_Johns   -03:30 und Sommerzeit
        #   Pacific/Chatham    +12:45, jenseits der Datumsgrenze
        #   Australia/Lord_Howe +10:30 mit halbstuendiger Umstellung
        # An den Halb- und Dreiviertelstunden faellt Ziffernarithmetik am
        # ehesten auf. Verifiziert (2026-09-10), dass die TZ-Variable Darts
        # DateTime im flutter-test-Prozess wirklich erreicht - die Matrix ist
        # kein Vakuum. Kosten: rund eine Minute pro Zone.
        tz:
          - UTC
          - Europe/Berlin
          - Asia/Tokyo
          - America/St_Johns
          - Pacific/Chatham
          - Australia/Lord_Howe
    env:
      TZ: ${{ matrix.tz }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-${{ hashFiles('pubspec.lock') }}
          restore-keys: pub-
      - run: flutter pub get
      - name: Confirm the runner really is in this timezone
        # Ohne diesen Beweis koennte die Matrix sechsmal dasselbe pruefen und
        # niemandem auffallen. `date` zeigt den Versatz, den auch Dart sieht.
        run: date +"%Z %z (%Y-%m-%d %H:%M)"
      # Die Alarm-Ueberlebensmessung faellt ein Urteil ("hat den Reboot
      # ueberlebt" / "nicht"), also muss ihr Messinstrument selbst geprueft
      # sein. Zweimal hat es hier danebengelegen: erst fand das Muster nichts,
      # dann zaehlte es fremde Alarme mit und meldete ein unbegruendetes FAIL
      # (docs/TODO.md T-99, T-102). Der Selbsttest laeuft gegen aufgezeichnete
      # dumpsys-Ausgabe, braucht also keinen Emulator - und gehoert deshalb in
      # die schnelle Spur, nicht erst in den E2E-Job.
      - name: Alarm-survival detection self-test
        if: matrix.tz == 'UTC'
        run: bash .github/scripts/check_alarm_survival.sh --self-test
      - name: Analyze
        # Frame-unabhaengig, deshalb nur im UTC-Bein - sechsmal waere
        # Verschwendung ohne zusaetzliche Aussage.
        if: matrix.tz == 'UTC'
        run: flutter analyze
      - name: Test
        run: flutter test --concurrency 2
      - name: Test with coverage
        if: matrix.tz == 'UTC'
        # Bewusst KEIN Prozent-Gate: eine willkuerliche Schwelle belohnt hier
        # das Falsche - triviale Getter-Tests heben sie, waehrend die
        # Fehlerklasse dieses Projekts (Frame- und Strukturfehler) von
        # Zeilenabdeckung ueberhaupt nicht erfasst wird. Die lcov-Datei ist
        # ein Artefakt zum Nachsehen, kein Tor.
        run: flutter test --coverage --concurrency 2
      - name: Upload coverage
        if: matrix.tz == 'UTC'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-lcov
          path: coverage/lcov.info
          if-no-files-found: warn
          retention-days: 14

  build-dev-apk:
    name: Build Android (development)
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-${{ hashFiles('pubspec.lock') }}
          restore-keys: pub-
      - uses: actions/cache@v4
        with:
          # docs/TODO.md T-102: vorher lag hier `~/.gradle/caches` komplett drin.
          # Das waechst unbegrenzt - es enthaelt neben den heruntergeladenen
          # Abhaengigkeiten auch jede transformierte AAR und jeden
          # Build-Cache-Eintrag. Ergebnis: zwei Gradle-Caches mit 3746 MB und
          # 2397 MB, und ein Restore, der laenger dauert als der Build spart.
          # Im Lauf 34535358135 ist der Release-Build daran gestorben - der
          # Cache-Schritt kippte nach 2m49s, `flutter build apk` lief nie.
          # Gecacht wird jetzt nur, was sich wirklich lohnt: die geladenen
          # Module und der Wrapper.
          path: |
            ~/.gradle/caches/modules-2
            ~/.gradle/wrapper
          key: gradle-modules-${{ hashFiles('android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-modules-
      - run: flutter pub get
      - run: flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: app-development-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          # docs/TODO.md T-100: ohne dieses Feld greift GitHubs Standard von
          # 90 Tagen. Bei ~94 MB je Debug-APK und einem Push pro Arbeitsschritt
          # waren so 1375 MB Artefaktspeicher aufgelaufen - beim 500-MB-
          # Kontingent eines privaten Repos das 2,75-fache. Ein Entwicklungs-APK
          # ist nach wenigen Tagen wertlos, weil der naechste Push es ersetzt.
          retention-days: 5

  # Everything below only runs for the full pipeline (master pushes and PRs into master) -
  # not for plain dev-branch pushes.

  security-gate:
    # Das SCA-/Secret-/SAST-Tor liegt in einer wiederverwendbaren Datei, damit
    # der Tag-getriggerte Release-Pfad (release.yml) dasselbe Tor durchlaeuft -
    # vorher hatte er ueberhaupt keins.
    if: github.ref == 'refs/heads/master' || github.event_name == 'pull_request'
    uses: ./.github/workflows/security-gate.yml

  e2e-tests:
    name: E2E tests (real emulator)
    # Runs the same real-emulator suite as release.yml (docs/TODO.md T-37) -
    # so a broken scenario is caught on the next master push/PR, not only
    # when someone cuts a release, which had never happened before this.
    if: github.ref == 'refs/heads/master' || github.event_name == 'pull_request'
    uses: ./.github/workflows/e2e-tests.yml

  build-android-release:
    name: Build Android (production)
    if: github.ref == 'refs/heads/master' || github.event_name == 'pull_request'
    needs: [analyze-and-test, security-gate, e2e-tests]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-${{ hashFiles('pubspec.lock') }}
          restore-keys: pub-
      - uses: actions/cache@v4
        with:
          # docs/TODO.md T-102: vorher lag hier `~/.gradle/caches` komplett drin.
          # Das waechst unbegrenzt - es enthaelt neben den heruntergeladenen
          # Abhaengigkeiten auch jede transformierte AAR und jeden
          # Build-Cache-Eintrag. Ergebnis: zwei Gradle-Caches mit 3746 MB und
          # 2397 MB, und ein Restore, der laenger dauert als der Build spart.
          # Im Lauf 34535358135 ist der Release-Build daran gestorben - der
          # Cache-Schritt kippte nach 2m49s, `flutter build apk` lief nie.
          # Gecacht wird jetzt nur, was sich wirklich lohnt: die geladenen
          # Module und der Wrapper.
          path: |
            ~/.gradle/caches/modules-2
            ~/.gradle/wrapper
          key: gradle-modules-${{ hashFiles('android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-modules-

      - name: Decode signing key
        run: |
          mkdir -p android/app/keystore
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/app/keystore/wakeywakey-release.jks
          cat > android/key.properties <<EOF
          storePassword=${{ secrets.KEYSTORE_STORE_PASSWORD }}
          keyPassword=${{ secrets.KEYSTORE_KEY_PASSWORD }}
          keyAlias=${{ secrets.KEYSTORE_KEY_ALIAS }}
          storeFile=keystore/wakeywakey-release.jks
          EOF

      - run: flutter pub get
      - run: flutter build apk --release

      - name: Verify signing
        run: |
          BUILD_TOOLS=$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)
          "$ANDROID_HOME/build-tools/$BUILD_TOOLS/apksigner" verify --verbose \
            build/app/outputs/flutter-apk/app-release.apk

      - name: Clean up signing key
        if: always()
        run: rm -rf android/app/keystore android/key.properties

      - uses: actions/upload-artifact@v4
        with:
          name: app-production-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          # Laenger als das Entwicklungs-APK, weil das gegatete Release-Artefakt
          # der Sache nach das ist, was man verprobt oder verteilt - aber nicht
          # 90 Tage (docs/TODO.md T-100). Ein Tag-Release haengt sein APK
          # ohnehin dauerhaft an die GitHub-Release-Seite.
          retention-days: 30

  mobsf-full-scan:
    name: MobSF (full static scan of production APK)
    if: github.ref == 'refs/heads/master' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    needs: build-android-release
    permissions:
      # Declaring permissions: on a job replaces the whole default set, not
      # just adds to it - contents: read is needed too, or actions/checkout
      # fails with a redacted "Repository not found" (this repo is private).
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: app-production-apk
      - name: Start MobSF
        run: |
          docker run -d --name mobsf -p 8000:8000 opensecurity/mobile-security-framework-mobsf:latest
          for i in $(seq 1 30); do
            if curl -sf -m 5 http://localhost:8000/ -o /dev/null; then
              echo "MobSF is up"
              break
            fi
            sleep 5
          done
      - name: Scan APK
        run: |
          API_KEY=$(docker logs mobsf 2>&1 | grep "REST API Key" | tail -1 | grep -oE '[0-9a-f]{64}')
          echo "Uploading APK..."
          UPLOAD=$(curl -s -X POST "http://localhost:8000/api/v1/upload" \
            -H "Authorization: $API_KEY" \
            -F "file=@app-release.apk")
          echo "$UPLOAD"
          HASH=$(echo "$UPLOAD" | python3 -c "import sys,json; print(json.load(sys.stdin)['hash'])")
          echo "Scanning (hash=$HASH)..."
          curl -s -X POST "http://localhost:8000/api/v1/scan" \
            -H "Authorization: $API_KEY" \
            -F "hash=$HASH" -F "scan_type=apk" -F "file_name=app-release.apk" \
            -o mobsf-report.json
          python3 "$GITHUB_WORKSPACE/scripts/mobsf_summary.py" mobsf-report.json \
            "$GITHUB_WORKSPACE/.github/security-exceptions.json"
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobsf-report
          path: mobsf-report.json
          retention-days: 30
      - name: Revoke the release artifact
        # A HIGH finding here can't have prevented build-android-release from
        # already uploading app-production-apk (this job needs that artifact
        # to scan it, so it necessarily runs after). Delete it retroactively
        # instead of leaving an un-vetted APK downloadable from a red run.
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ARTIFACT_ID=$(gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts" \
            --jq '.artifacts[] | select(.name=="app-production-apk") | .id' | head -1)
          if [ -n "$ARTIFACT_ID" ]; then
            echo "Deleting app-production-apk artifact ($ARTIFACT_ID) - MobSF found an un-accepted HIGH finding."
            gh api -X DELETE "repos/${{ github.repository }}/actions/artifacts/$ARTIFACT_ID"
          else
            echo "app-production-apk artifact not found (already deleted, or never uploaded)."
          fi
      - name: Stop MobSF
        if: always()
        run: docker rm -f mobsf || true
