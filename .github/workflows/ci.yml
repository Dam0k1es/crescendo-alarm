name: CI
#
# Branch strategy:
# - dev: fast feedback (analyze + test) plus a debug "development" APK, uploaded as a build
#   artifact so any dev-branch commit can be installed for a quick look.
# - master (and PRs targeting it): the full pipeline - analyze, test, SCA, secret scan,
#   mobsfscan, a signed "production" release APK build, and a full MobSF static scan of that
#   build. The production APK is uploaded as a build artifact on every master push, in addition
#   to the separate tag-triggered release workflow that attaches one to a formal GitHub Release.
# Only Android is built here - Linux/iOS/desktop/web targets aren't real deployment targets for
# this project (see README "Supported Platforms"), so there's no CI job for them.

on:
  push:
    branches: [master, dev]
  pull_request:
    branches: [master, dev]
  workflow_dispatch:

env:
  FLUTTER_VERSION: "3.47.2"

jobs:
  analyze-and-test:
    # The name stays, because release.yml and the needs: below refer to it.
    # In substance this is now a matrix over timezones - see below.
    name: Analyze & Test (TZ=${{ matrix.tz }})
    runs-on: ubuntu-latest
    strategy:
      # Let a failure in one zone still let the other zones run to
      # completion: with a frame bug, the PATTERN across zones is the
      # actual diagnosis (only half-hour offsets? only daylight saving?).
      fail-fast: false
      matrix:
        # The dominant bug class in this project is frame confusion
        # (instant vs. wall clock time). Three real bugs - docs/TODO.md T-61,
        # T-74d, T-76 - were STRUCTURALLY invisible on the dev machine,
        # because it runs on UTC+0; so do GitHub's runners. The zones are
        # therefore chosen for bug potential, not familiarity:
        #   Europe/Berlin      daylight saving transition (T-74d/T-76)
        #   Asia/Tokyo         large offset, NO daylight saving
        #   America/St_Johns   -03:30 and daylight saving
        #   Pacific/Chatham    +12:45, beyond the date line
        #   Australia/Lord_Howe +10:30 with a half-hour transition
        # Digit arithmetic fails first at the half- and three-quarter-hour
        # marks. Verified (2026-09-10) that the TZ variable really reaches
        # Dart's DateTime inside the flutter-test process - the matrix is
        # not running in a vacuum. Cost: roughly one minute per zone.
        tz:
          - UTC
          - Europe/Berlin
          - Asia/Tokyo
          - America/St_Johns
          - Pacific/Chatham
          - Australia/Lord_Howe
    env:
      TZ: ${{ matrix.tz }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - uses: actions/cache@v6
        with:
          path: ~/.pub-cache
          key: pub-${{ hashFiles('pubspec.lock') }}
          restore-keys: pub-
      - run: flutter pub get
      - name: Confirm the runner really is in this timezone
        # Without this proof the matrix could check the same thing six
        # times over and nobody would notice. `date` shows the offset that
        # Dart sees too.
        run: date +"%Z %z (%Y-%m-%d %H:%M)"
      # The alarm-survival measurement produces a verdict ("survived the
      # reboot" / "did not"), so its measuring instrument must itself be
      # verified. It has gotten this wrong twice before: first the pattern
      # found nothing, then it counted foreign alarms and reported an
      # unfounded FAIL (docs/TODO.md T-99, T-102). The self-test runs
      # against recorded dumpsys output, so it needs no emulator - and
      # therefore belongs in the fast lane, not only in the E2E job.
      - name: Alarm-survival detection self-test
        if: matrix.tz == 'UTC'
        run: bash .github/scripts/check_alarm_survival.sh --self-test
      # Same reasoning as the alarm-survival self-test above: this script
      # produces a verdict (forbidden native dependency found / not found),
      # so its detection logic must prove itself before being trusted - an
      # independent audit found it was the one verdict-producing script in
      # the project without this (docs/TODO.md T-144). No SBOM/Android build
      # needed, so it belongs in the fast lane.
      - name: Proprietary native dependency detection self-test
        if: matrix.tz == 'UTC'
        run: python3 scripts/check_proprietary_native_deps.py --self-test
      - name: Analyze
        # Frame-independent, hence only in the UTC leg - running it six
        # times would be waste with no additional signal.
        if: matrix.tz == 'UTC'
        run: flutter analyze
      - name: Test
        run: flutter test --concurrency 2
      - name: Test with coverage
        if: matrix.tz == 'UTC'
        # Deliberately NO percentage gate: an arbitrary threshold would
        # reward the wrong thing here - trivial getter tests raise it,
        # while this project's actual bug class (frame and structural
        # errors) isn't captured by line coverage at all. The lcov file is
        # an artifact to inspect, not a gate.
        run: flutter test --coverage --concurrency 2
      - name: Upload coverage
        if: matrix.tz == 'UTC'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-lcov
          path: coverage/lcov.info
          if-no-files-found: warn
          retention-days: 14

  build-dev-apk:
    name: Build Android (development)
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - uses: actions/cache@v6
        with:
          path: ~/.pub-cache
          key: pub-${{ hashFiles('pubspec.lock') }}
          restore-keys: pub-
      - uses: actions/cache@v6
        with:
          # docs/TODO.md T-102: this used to hold the whole of `~/.gradle/caches`.
          # That grows without bound - besides the downloaded dependencies it
          # also holds every transformed AAR and every build-cache entry. Result:
          # two Gradle caches of 3746 MB and 2397 MB, and a restore that took
          # longer than the build it was meant to save. In run 34535358135 the
          # release build died from it - the cache step timed out after 2m49s,
          # `flutter build apk` never ran. Now only what's actually worth it is
          # cached: the downloaded modules and the wrapper.
          path: |
            ~/.gradle/caches/modules-2
            ~/.gradle/wrapper
          key: gradle-modules-${{ hashFiles('android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-modules-
      - run: flutter pub get
      - run: flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: app-development-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          # docs/TODO.md T-100: without this field, GitHub's default of
          # 90 days applies. At ~94 MB per debug APK and one push per work
          # step, that had built up to 1375 MB of artifact storage - 2.75x
          # a private repo's 500 MB quota. A development APK is worthless
          # after a few days anyway, since the next push replaces it.
          retention-days: 5

  # Everything below only runs for the full pipeline (master pushes and PRs into master) -
  # not for plain dev-branch pushes.

  security-gate:
    # The SCA/secret/SAST gate lives in a reusable file so the tag-triggered
    # release path (release.yml) goes through the same gate - it used to
    # have none at all.
    if: github.ref == 'refs/heads/master' || (github.event_name == 'pull_request' && github.base_ref == 'master')
    uses: ./.github/workflows/security-gate.yml

  e2e-tests:
    name: E2E tests (real emulator)
    # Runs the same real-emulator suite as release.yml (docs/TODO.md T-37) -
    # so a broken scenario is caught on the next master push/PR, not only
    # when someone cuts a release, which had never happened before this.
    if: github.ref == 'refs/heads/master' || (github.event_name == 'pull_request' && github.base_ref == 'master')
    uses: ./.github/workflows/e2e-tests.yml

  build-android-release:
    name: Build Android (production)
    if: github.ref == 'refs/heads/master' || (github.event_name == 'pull_request' && github.base_ref == 'master')
    needs: [analyze-and-test, security-gate, e2e-tests]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - uses: actions/cache@v6
        with:
          path: ~/.pub-cache
          key: pub-${{ hashFiles('pubspec.lock') }}
          restore-keys: pub-
      - uses: actions/cache@v6
        with:
          # docs/TODO.md T-102: this used to hold the whole of `~/.gradle/caches`.
          # That grows without bound - besides the downloaded dependencies it
          # also holds every transformed AAR and every build-cache entry. Result:
          # two Gradle caches of 3746 MB and 2397 MB, and a restore that took
          # longer than the build it was meant to save. In run 34535358135 the
          # release build died from it - the cache step timed out after 2m49s,
          # `flutter build apk` never ran. Now only what's actually worth it is
          # cached: the downloaded modules and the wrapper.
          path: |
            ~/.gradle/caches/modules-2
            ~/.gradle/wrapper
          key: gradle-modules-${{ hashFiles('android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-modules-
      - name: Install osv-scanner
        run: |
          curl -sSfL -o /usr/local/bin/osv-scanner \
            "https://github.com/google/osv-scanner/releases/latest/download/osv-scanner_linux_amd64"
          chmod +x /usr/local/bin/osv-scanner

      - name: Decode signing key
        run: |
          mkdir -p android/app/keystore
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/app/keystore/crescendo-alarm-release.jks
          cat > android/key.properties <<EOF
          storePassword=${{ secrets.KEYSTORE_STORE_PASSWORD }}
          keyPassword=${{ secrets.KEYSTORE_KEY_PASSWORD }}
          keyAlias=${{ secrets.KEYSTORE_KEY_ALIAS }}
          storeFile=keystore/crescendo-alarm-release.jks
          EOF

      - run: flutter pub get
      - run: flutter build apk --release

      - name: Verify signing
        run: |
          BUILD_TOOLS=$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)
          "$ANDROID_HOME/build-tools/$BUILD_TOOLS/apksigner" verify --verbose \
            build/app/outputs/flutter-apk/app-release.apk

      - name: Scan native Android dependencies (osv-scanner)
        # docs/TODO.md T-148: security-gate's own osv-scanner step only ever
        # covered pubspec.lock (the Dart side) - the native Android
        # dependency tree (AndroidX, media3, the camera plugin's own
        # transitive deps, ...) had zero SCA coverage, since this project
        # has no gradle.lockfile for osv-scanner to read directly. The
        # `releaseRuntimeClasspath` configuration is already fully resolved
        # by the build above, so generating its SBOM here is cheap - the
        # scope (`includeConfigs` in app/build.gradle.kts) deliberately
        # excludes debug/test/androidTest configurations, which pulled in
        # unrelated CVEs against instrumentation-test tooling that never
        # ships (found while wiring this up: `netty`, via
        # `com.google.testing.platform`/`com.android.tools.emulator`).
        run: |
          ./android/gradlew -p android :app:cyclonedxBom
          osv-scanner --lockfile=build/app/reports/cyclonedx/bom.json

      - name: Check for forbidden native dependencies (T-144)
        # test/no_proprietary_dependencies_test.dart can only see
        # pubspec.yaml/pubspec.lock and lib/ imports - a proprietary AAR
        # arriving through a plugin's own build.gradle (exactly how Google's
        # ML Kit arrived via mobile_scanner before T-33) never appears in
        # either. This reuses the SBOM generated above instead of resolving
        # the dependency tree a second time.
        run: python3 scripts/check_proprietary_native_deps.py build/app/reports/cyclonedx/bom.json

      - name: Clean up signing key
        if: always()
        run: rm -rf android/app/keystore android/key.properties

      - uses: actions/upload-artifact@v4
        with:
          name: app-production-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          # Longer than the development APK, because the gated release
          # artifact is, in substance, what actually gets trialed or
          # distributed - but not 90 days (docs/TODO.md T-100). A tag
          # release attaches its APK permanently to the GitHub Release
          # page anyway.
          retention-days: 30

  mobsf-full-scan:
    name: MobSF (full static scan of production APK)
    if: github.ref == 'refs/heads/master' || (github.event_name == 'pull_request' && github.base_ref == 'master')
    runs-on: ubuntu-latest
    needs: build-android-release
    permissions:
      # Declaring permissions: on a job replaces the whole default set, not
      # just adds to it - contents: read is needed too, or actions/checkout
      # fails with a redacted "Repository not found" (this repo is private).
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v8
        with:
          name: app-production-apk
      - name: Start MobSF
        run: |
          docker run -d --name mobsf -p 8000:8000 opensecurity/mobile-security-framework-mobsf:latest
          for i in $(seq 1 30); do
            if curl -sf -m 5 http://localhost:8000/ -o /dev/null; then
              echo "MobSF is up"
              break
            fi
            sleep 5
          done
      - name: Scan APK
        run: |
          API_KEY=$(docker logs mobsf 2>&1 | grep "REST API Key" | tail -1 | grep -oE '[0-9a-f]{64}')
          echo "Uploading APK..."
          UPLOAD=$(curl -s -X POST "http://localhost:8000/api/v1/upload" \
            -H "Authorization: $API_KEY" \
            -F "file=@app-release.apk")
          echo "$UPLOAD"
          HASH=$(echo "$UPLOAD" | python3 -c "import sys,json; print(json.load(sys.stdin)['hash'])")
          echo "Scanning (hash=$HASH)..."
          curl -s -X POST "http://localhost:8000/api/v1/scan" \
            -H "Authorization: $API_KEY" \
            -F "hash=$HASH" -F "scan_type=apk" -F "file_name=app-release.apk" \
            -o mobsf-report.json
          python3 "$GITHUB_WORKSPACE/scripts/mobsf_summary.py" mobsf-report.json \
            "$GITHUB_WORKSPACE/.github/security-exceptions.json"
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobsf-report
          path: mobsf-report.json
          retention-days: 30
      - name: Revoke the release artifact
        # A HIGH finding here can't have prevented build-android-release from
        # already uploading app-production-apk (this job needs that artifact
        # to scan it, so it necessarily runs after). Delete it retroactively
        # instead of leaving an un-vetted APK downloadable from a red run.
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ARTIFACT_ID=$(gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts" \
            --jq '.artifacts[] | select(.name=="app-production-apk") | .id' | head -1)
          if [ -n "$ARTIFACT_ID" ]; then
            echo "Deleting app-production-apk artifact ($ARTIFACT_ID) - MobSF found an un-accepted HIGH finding."
            gh api -X DELETE "repos/${{ github.repository }}/actions/artifacts/$ARTIFACT_ID"
          else
            echo "app-production-apk artifact not found (already deleted, or never uploaded)."
          fi
      - name: Stop MobSF
        if: always()
        run: docker rm -f mobsf || true
