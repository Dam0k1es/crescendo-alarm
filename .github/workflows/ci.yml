name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

env:
  FLUTTER_VERSION: "3.47.2"

jobs:
  analyze-and-test:
    name: Analyze & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  sca-and-secrets:
    name: SCA & Secret Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install osv-scanner
        run: |
          curl -sSfL -o /usr/local/bin/osv-scanner \
            "https://github.com/google/osv-scanner/releases/latest/download/osv-scanner_linux_amd64"
          chmod +x /usr/local/bin/osv-scanner
      - name: Install trufflehog
        run: |
          curl -sSfL https://raw.githubusercontent.com/trufflesecurity/trufflehog/main/scripts/install.sh \
            | sh -s -- -b /usr/local/bin
      - name: osv-scanner (SCA)
        run: osv-scanner --lockfile=pubspec.lock
      - name: trufflehog (secrets)
        run: trufflehog filesystem --results=verified,unknown --fail .

  mobsfscan:
    name: mobsfscan (Android source)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install mobsfscan
      - name: Run mobsfscan
        # --no-fail: findings here are informational (see docs/quality-baseline-2026-09.md -
        # the one real hit, a StrandHogg task-hijacking warning, is a documented tool
        # limitation/false-positive that doesn't account for the Gradle-resolved targetSdk).
        # The JSON report is still uploaded below for review.
        run: mobsfscan --no-fail --json -o mobsfscan-report.json android/
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobsfscan-report
          path: mobsfscan-report.json

  build-linux:
    name: Build Linux (debug)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - name: Install Linux desktop build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev
      - run: flutter pub get
      - run: flutter build linux --debug

  build-android-debug:
    name: Build Android (debug)
    runs-on: ubuntu-latest
    outputs:
      apk-path: build/app/outputs/flutter-apk/app-debug.apk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - run: flutter pub get
      - run: flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk

  mobsf-full-scan:
    name: MobSF (full static scan of debug APK)
    runs-on: ubuntu-latest
    needs: build-android-debug
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: app-debug-apk
      - name: Start MobSF
        run: |
          docker run -d --name mobsf -p 8000:8000 opensecurity/mobile-security-framework-mobsf:latest
          for i in $(seq 1 30); do
            if curl -sf -m 5 http://localhost:8000/ -o /dev/null; then
              echo "MobSF is up"
              break
            fi
            sleep 5
          done
      - name: Scan APK
        run: |
          API_KEY=$(docker logs mobsf 2>&1 | grep "REST API Key" | tail -1 | grep -oE '[0-9a-f]{64}')
          echo "Uploading APK..."
          UPLOAD=$(curl -s -X POST "http://localhost:8000/api/v1/upload" \
            -H "Authorization: $API_KEY" \
            -F "file=@app-debug.apk")
          echo "$UPLOAD"
          HASH=$(echo "$UPLOAD" | python3 -c "import sys,json; print(json.load(sys.stdin)['hash'])")
          echo "Scanning (hash=$HASH)..."
          curl -s -X POST "http://localhost:8000/api/v1/scan" \
            -H "Authorization: $API_KEY" \
            -F "hash=$HASH" -F "scan_type=apk" -F "file_name=app-debug.apk" \
            -o mobsf-report.json
          python3 "$GITHUB_WORKSPACE/scripts/mobsf_summary.py" mobsf-report.json
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobsf-report
          path: mobsf-report.json
      - name: Stop MobSF
        if: always()
        run: docker rm -f mobsf || true
