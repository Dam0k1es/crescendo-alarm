name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

env:
  FLUTTER_VERSION: "3.47.2"

jobs:
  e2e-tests:
    name: E2E tests (real emulator)
    # A production release requires these to actually pass on a real device -
    # no exceptions, no time-boxed skip. If this job fails or times out, the
    # release does not happen (build-signed-release below depends on it).
    # The job itself lives in e2e-tests.yml (reusable) - ci.yml calls the
    # same workflow on master pushes/PRs, so this isn't the only place it
    # runs (docs/TODO.md T-37).
    uses: ./.github/workflows/e2e-tests.yml

  security-gate:
    name: Security gate
    # Die Luecke, die hier bestand: dieser Pfad baute, signierte und haengte
    # ein APK an ein GitHub-Release, ohne SCA, Secret- oder SAST-Pruefung -
    # obwohl derselbe Commit auf `master` daran gescheitert waere.
    uses: ./.github/workflows/security-gate.yml

  build-signed-release:
    name: Build & sign release APK
    needs: [e2e-tests, security-gate]
    runs-on: ubuntu-latest
    permissions:
      # Declaring permissions: on a job replaces the whole default set, not
      # just adds to it. This repo's default workflow token permission is
      # read-only (docs/TODO.md T-40), which the "Attach to GitHub Release"
      # step below needs write access to contents for (contents: write
      # implies read, so no separate contents: read entry is needed).
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-${{ hashFiles('pubspec.lock') }}
          restore-keys: pub-
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - name: Decode signing key
        run: |
          mkdir -p android/app/keystore
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/app/keystore/wakeywakey-release.jks
          cat > android/key.properties <<EOF
          storePassword=${{ secrets.KEYSTORE_STORE_PASSWORD }}
          keyPassword=${{ secrets.KEYSTORE_KEY_PASSWORD }}
          keyAlias=${{ secrets.KEYSTORE_KEY_ALIAS }}
          storeFile=keystore/wakeywakey-release.jks
          EOF

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --release

      - name: Verify signing
        run: |
          BUILD_TOOLS=$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)
          "$ANDROID_HOME/build-tools/$BUILD_TOOLS/apksigner" verify --verbose \
            build/app/outputs/flutter-apk/app-release.apk

      - name: Clean up signing key
        if: always()
        run: rm -rf android/app/keystore android/key.properties

      - uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: build/app/outputs/flutter-apk/app-release.apk
          generate_release_notes: true

  cleanup-old-artifacts:
    name: Keep only latest run's artifacts + latest successful run's
    # Runs after every attempt (needs: [...] + if: always()), whether or not
    # the release actually happened, so a failed e2e-tests run's evidence
    # still gets pruned down over time. Storage policy: keep this run's own
    # artifacts, plus whichever *other* release.yml run was most recently
    # successful (so there's always one known-good reference build/evidence
    # set available even when the latest run failed) - everything else from
    # this workflow gets deleted. ci.yml's artifacts are untouched; see
    # .github/scripts/cleanup_old_artifacts.sh for how that scoping works.
    needs: [e2e-tests, build-signed-release]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      # Declaring `permissions:` on a job replaces the whole default set, not
      # just adds to it - contents: read is needed too, or actions/checkout
      # fails with a redacted "Repository not found" (this repo is private).
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v4
      - name: Delete superseded release.yml artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/cleanup_old_artifacts.sh
