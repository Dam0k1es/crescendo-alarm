name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

env:
  FLUTTER_VERSION: "3.47.2"

jobs:
  e2e-tests:
    name: E2E tests (real emulator)
    # A production release requires these to actually pass on a real device -
    # no exceptions, no time-boxed skip. If this job fails or times out, the
    # release does not happen (build-signed-release below depends on it).
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-${{ hashFiles('pubspec.lock') }}
          restore-keys: pub-
      - run: flutter pub get

      - name: Enable KVM group perms
        # /dev/kvm exists on GitHub's Linux runners but isn't accessible to
        # the runner user by default - without this, android-emulator-runner
        # silently falls back to `-accel off` (full software CPU emulation),
        # and the emulator then takes far longer to boot than its own
        # boot-wait timeout allows. See docs/quality-baseline-2026-09.md's VM
        # recommendations for why real KVM access matters this much - this
        # project has hit the software-emulation failure mode before, just on
        # a different (nested-virtualization) root cause.
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run E2E tests on a real emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            adb wait-for-device

            # flutter test builds, installs, and runs the app - grant the
            # permissions PermissionsManager.requestPermissions() will ask
            # for as soon as the package actually appears, in the background,
            # so the real run never hits an OS permission dialog.
            (
              for i in $(seq 1 120); do
                if adb shell pm list packages | grep -q com.wakeywakey.wakeywakey; then
                  adb shell pm grant com.wakeywakey.wakeywakey android.permission.CAMERA || true
                  adb shell pm grant com.wakeywakey.wakeywakey android.permission.READ_CALENDAR || true
                  adb shell pm grant com.wakeywakey.wakeywakey android.permission.WRITE_CALENDAR || true
                  adb shell pm grant com.wakeywakey.wakeywakey android.permission.POST_NOTIFICATIONS || true
                  adb shell appops set com.wakeywakey.wakeywakey SCHEDULE_EXACT_ALARM allow || true
                  break
                fi
                sleep 2
              done
            ) &

            flutter test integration_test/app_test.dart -d emulator-5554

  build-signed-release:
    name: Build & sign release APK
    needs: e2e-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-${{ hashFiles('pubspec.lock') }}
          restore-keys: pub-
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - name: Decode signing key
        run: |
          mkdir -p android/app/keystore
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/app/keystore/wakeywakey-release.jks
          cat > android/key.properties <<EOF
          storePassword=${{ secrets.KEYSTORE_STORE_PASSWORD }}
          keyPassword=${{ secrets.KEYSTORE_KEY_PASSWORD }}
          keyAlias=${{ secrets.KEYSTORE_KEY_ALIAS }}
          storeFile=keystore/wakeywakey-release.jks
          EOF

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --release

      - name: Verify signing
        run: |
          BUILD_TOOLS=$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)
          "$ANDROID_HOME/build-tools/$BUILD_TOOLS/apksigner" verify --verbose \
            build/app/outputs/flutter-apk/app-release.apk

      - name: Clean up signing key
        if: always()
        run: rm -rf android/app/keystore android/key.properties

      - uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: build/app/outputs/flutter-apk/app-release.apk
          generate_release_notes: true
