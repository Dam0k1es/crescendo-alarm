# docs/TODO.md T-148: osv-scanner/mobsfscan only ever check the dependency
# versions currently pinned - they can't tell anyone a newer, fixed version
# exists. Without this file that side was entirely manual (`flutter pub
# outdated` showed 14 packages behind during this same session's work), so a
# known CVE with an available fix could sit unnoticed indefinitely.
#
# Every ecosystem opens PRs against `dev`, never `master` (see the pinned
# "work-on-dev-not-master" project rule): `master` pushes trigger the full,
# expensive gate (security-gate, a 22-minute E2E emulator run, a signed
# build, MobSF) - a `dev` push runs analyze + tests only, at roughly a fifth
# of the cost, and `master` only ever advances by an explicit fast-forward
# once a state is worth that full gate.
version: 2
updates:
  - package-ecosystem: "pub"
    directory: "/"
    target-branch: "dev"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps(pub)"

  - package-ecosystem: "gradle"
    directory: "/android"
    target-branch: "dev"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps(gradle)"

  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "dev"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps(actions)"
