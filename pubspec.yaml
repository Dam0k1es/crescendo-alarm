name: wakeywakey
description: "WakeyWakey is a smart alarm clock app with advanced features to make your sleep-wake rhythm more beautiful. Automatically created alarms based on your calendar entries save you the hassle of setting alarms. QR codes for deactivating alarms get you out of bed safely. the modern UI makes it pleasant to use. And all without any tracking!"
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.0+1

environment:
  sdk: '>=3.3.3 <4.0.0'

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter

  flutter_launcher_icons: ^0.14.4

  # docs/TODO.md T-05: replaced the Syncfusion calendar packages, whose licence
  # forbids use without a community or commercial licence and therefore cannot
  # travel inside a GPLv3 APK. calendar_view is MIT. Guarded by
  # test/no_proprietary_dependencies_test.dart so it cannot come back quietly.
  calendar_view: ^2.0.0
  device_calendar: ^4.3.2

  provider: ^6.1.2
  shared_preferences: ^2.2.3

  permission_handler: ^13.0.2

  alarm: ^5.12.0
  audioplayers: ^6.0.0

  # A user-imported custom alarm tone (docs/TODO.md T-29 follow-up): MIT
  # licensed, and picking a single audio file needs no declared Android
  # permission - it goes through the system document picker (SAF), not
  # broad storage access. path_provider was already a transitive dependency
  # (via shared_preferences); declared directly here because this project's
  # own code now calls it, not just a plugin's internals.
  file_picker: ^13.1.0
  path_provider: ^2.1.4

  qr_flutter: ^4.1.0

  uuid: ^4.4.0

  intl: ^0.20.3
  timezone: ^0.11.0

  flutter_colorpicker: ^1.1.0

  flutter_markdown_plus: ^1.0.12

  # `any` was an open flank: a broken version could have come in silently.
  # Pinned to the version that already resolves anyway.
  awesome_notifications: ^0.12.1
  # docs/TODO.md T-33: replaced mobile_scanner, which links Google's
  # proprietary ML Kit barcode binaries (bundled into the APK by default) -
  # they cannot travel inside a GPLv3 APK. flutter_zxing is MIT and wraps
  # zxing-cpp (Apache-2.0); nothing proprietary is linked. Guarded by
  # test/no_proprietary_dependencies_test.dart.
  #
  # Pinned EXACTLY, unlike everything else here. An independent audit of the
  # swap found: no verified publisher, a single maintainer, 3.0.0 replaced the
  # vendored zxing-cpp wholesale 16 days before this adoption, and the package
  # compiles ~450 C/C++ translation units into the app. Its Android module also
  # hardcodes `compileSdk 36` - the exact shape of the problem that already
  # forced the permission_handler_android override below. A `^` range on that
  # combination is a bet this project has lost before.
  flutter_zxing: 3.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  # Belongs here, not under `dependencies`: flutter_lints supplies analysis
  # rules only (see analysis_options.yaml) and is never imported at runtime.
  flutter_lints: ^6.0.0

# device_calendar (even its latest release, 4.3.3) still pins `timezone: ^0.9.0`,
# while this app itself declares `timezone: ^0.11.0` above and uses 0.11's
# refreshed IANA data for the frame handling in lib/models/scheduling/ -
# a genuine, currently unresolved conflict between the two packages' declared
# constraints. Forcing timezone to 0.11.x here is safe in practice: the public
# API (TZDateTime, Location, getLocation) hasn't changed between 0.9.x and
# 0.11.x, only the bundled IANA timezone data was refreshed. Revisit this once
# device_calendar publishes a release that allows timezone ^0.11.0.
dependency_overrides:
  timezone: ^0.11.0

  # permission_handler_android >=14.0.0 hardcodes compileSdk = 37, which only
  # exists as a preview-numbered package (android-37.0/.1/.2) in the current
  # Android SDK repository, not as a plain "android-37" target - so any AGP
  # build fails with "Failed to find target with hash string 'android-37'".
  # Pin to the last version built against the stable compileSdk 34 until
  # upstream fixes this (https://github.com/Baseflow/flutter-permission-handler).
  permission_handler_android: 13.0.1

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true
  assets:
    # assets/icons/icon.png is deliberately NOT bundled: it's only the
    # source for `dart run flutter_launcher_icons` (its path is in that
    # tool's config below) and is read straight from disk. Nothing loads it
    # at runtime - it would be dead weight in the APK. The file stays in the
    # repo.
    - assets/icons/icon_no_shadow.png
    - assets/sounds/lollipop.mp3
    - assets/text/Privacy.md
    # docs/TODO.md T-142: flutter_zxing compiles third-party C/C++ into the
    # app - invisible to Flutter's own licence collector, which only reads
    # package-root LICENSE files. page_native_notices.dart reads this.
    - assets/text/NativeCodeNotices.txt
    # docs/TODO.md T-36: the root LICENSE file itself, bundled directly
    # (not copied into assets/) so there is exactly one copy to keep in
    # sync - page_license.dart reads it straight from here.
    - LICENSE
    - assets/sounds/annoying_alarm.mp3
    - assets/sounds/old_telephone_ring.mp3
    - assets/sounds/wake_up.mp3
    - assets/sounds/wakeywakey.mp3
    - assets/sounds/wakeywakey2.mp3
  # To add assets to your application, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/assets-and-images/#resolution-aware

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/assets-and-images/#from-packages

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/custom-fonts/#from-packages

flutter_launcher_icons:
  image_path: "assets/icons/icon.png"
  android: true
  ios: true