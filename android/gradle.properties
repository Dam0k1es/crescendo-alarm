# docs/TODO.md T-195: 1536M (the Flutter template default, unchanged since the
# initial commit) left R8's release minification at the edge of its heap -
# master run 36252759755 died in :app:minifyReleaseWithR8 with
# "java.lang.OutOfMemoryError: Java heap space" on a commit that changed no
# Android code at all. 3G still fits the 8 GB dev VM for a single build and is
# far below a GitHub runner's 16 GB.
org.gradle.jvmargs=-Xmx3G
org.gradle.parallel=false
org.gradle.caching=true
kotlin.daemon.jvmargs=-Xmx1024M
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
